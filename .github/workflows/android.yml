name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct APK download
        run: cp app/build/outputs/apk/debug/app-debug.apk SV-Rota1.apk
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" SV-Rota1.apk \
            --title "SV Rota1 Android #${{ github.run_number }}" \
            --notes "Versão de testes para Android. Baixe SV-Rota1.apk diretamente, sem ZIP. APK de depuração; não é uma versão assinada para distribuição pública." \
            --target "${{ github.sha }}" \
            --latest
      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: SV-Rota-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
