name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SV_VERSION_CODE: ${{ github.run_number }}
      SV_VERSION_NAME: 0.1.${{ github.run_number }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SV_SIGNING_KEYSTORE_BASE64 }}
      SV_KEYSTORE_PASSWORD: ${{ secrets.SV_KEYSTORE_PASSWORD }}
      SV_KEY_ALIAS: ${{ secrets.SV_KEY_ALIAS }}
      SV_KEY_PASSWORD: ${{ secrets.SV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SV_KEYSTORE_PASSWORD" && -n "$SV_KEY_ALIAS" && -n "$SV_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore private signing key
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sv-rota-release.jks"
          echo "SV_KEYSTORE_PATH=$RUNNER_TEMP/sv-rota-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Build debug APK until signing is configured
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct APK download
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.ready }}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk SV-Rota1.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk SV-Rota1.apk
          fi
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.ready }}" == "true" ]]; then
            NOTE="APK de produção assinado. Preserve o keystore para futuras atualizações."
          else
            NOTE="APK de testes (debug). Para habilitar a assinatura permanente, configure os quatro secrets SV_SIGNING_KEYSTORE_BASE64, SV_KEYSTORE_PASSWORD, SV_KEY_ALIAS e SV_KEY_PASSWORD."
          fi
          gh release create "android-${{ github.run_number }}" SV-Rota1.apk \
            --title "SV Rota1 Android #${{ github.run_number }}" \
            --notes "Baixe SV-Rota1.apk diretamente, sem ZIP. $NOTE" \
            --target "${{ github.sha }}" \
            --latest
      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: SV-Rota-debug-apk
          path: SV-Rota1.apk
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sv-rota-release.jks"
